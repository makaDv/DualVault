name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Security problems:** do not report them here — see SECURITY.md.
        **Privacy:** remove personal paths, names and credentials from logs before pasting.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output (redacted)
      render: text
  - type: input
    id: version
    attributes:
      label: DualVault version (`dualvault --version`)
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: OS and Python version
    validations:
      required: true
