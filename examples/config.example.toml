# DualVault example configuration.
# Copy to your config location (see `dualvault show`) or create one with `dualvault init`.
# Paths below are placeholders: replace them with your own.

[settings]
encrypt = false              # true = AES-256-GCM encrypted snapshots (.zip.dvenc)
password_file = ""           # optional, for unattended encrypted runs; protect this file!
compression_level = 6        # 0 (none) .. 9 (max)
rclone_binary = "rclone"     # or a full path to the rclone executable
log_level = "INFO"           # DEBUG, INFO, WARNING, ERROR
follow_symlinks = false

[retention]
keep_last = 7
keep_daily = 7
keep_weekly = 4
keep_monthly = 12

[[sources]]
name = "documents"
path = "C:/Users/YourName/Documents"      # Linux/macOS: "/home/yourname/Documents"
exclude = ["*.tmp", "~$*", "node_modules", ".git"]

[[sources]]
name = "photos"
path = "D:/Photos"
exclude = []

[[destinations]]
name = "external"
type = "local"
path = "E:/Backups/DualVault"            # external drive, NAS share or any folder
remote = ""

[[destinations]]
name = "cloud"
type = "rclone"
path = ""
remote = "gdrive:Backups/DualVault"      # configure "gdrive" first with `rclone config`
